# Release signing keystore configuration
# ========================================
# A project-local release keystore is configured below, so release APKs are
# signed with a stable key. That is what makes them installable on other
# devices and updatable later (same key = allowed update, different key =
# "App not installed").
#
# IMPORTANT: keep keystore.properties and keystore/ out of Git (already ignored).

storeFile=keystore/pashurakshak-release.jks
storePassword=PashuRakshak@2026
keyAlias=pashurakshak
keyPassword=PashuRakshak@2026
